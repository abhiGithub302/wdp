<!doctype html>
<html>
  <head>
    <title>W3.CSS Containers</title>

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
  </head>

  <body>
    <!-- PART 1: Header Container -->
    <header class="w3-container w3-blue">
      <h2>NIELIT Gorakhpur</h2>
    </header>

    <!-- PART 2: Section Container -->
    <section class="w3-container w3-light-grey">
      <h2>Our Courses</h2>
      <p>CCC, O Level, A Level</p>
    </section>

    <!-- PART 3: Footer Container -->
    <footer class="w3-container w3-black">
      <p>Copyright NIELIT</p>
    </footer>
  </body>
</html>
