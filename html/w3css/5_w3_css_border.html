<!DOCTYPE html>
<html>
<head>
    <title>W3.CSS Borders</title>

    <link rel="stylesheet"
    href="https://www.w3schools.com/w3css/4/w3.css">
</head>

<body>

    <!-- PART 1: Basic Border -->
    <div class="w3-container w3-border">
        <h3>About NIELIT</h3>
        <p>Welcome to our institute.</p>
    </div>

    <!-- PART 2: Border Color -->
    <div class="w3-container w3-border w3-border-blue">
        <h3>Courses</h3>
        <p>CCC | O Level | A Level</p>
    </div>

    <!-- PART 3: Left Border -->
    <div class="w3-panel w3-leftbar w3-border-green">
        <p>Admissions are open.</p>
    </div>

    <!-- PART 4: Right Border -->
    <div class="w3-panel w3-rightbar w3-border-red">
        <p>Examination Notice.</p>
    </div>

    <!-- PART 5: Top and Bottom Border -->
    <div class="w3-container w3-topbar w3-bottombar
                w3-border-blue">
        <h3>Important Information</h3>
        <p>Check the official website regularly.</p>
    </div>

    <!-- PART 6: Rounded Border -->
    <div class="w3-container w3-border w3-round-large">
        <h3>Student Information</h3>
        <p>Name: Rahul</p>
    </div>
    <div class="w3-panel w3-border w3-border-red">
    <p>Red border.</p>
</div>

<div class="w3-panel w3-border w3-border-blue">
    <p>Blue border.</p>
</div>

<div class="w3-panel w3-border w3-border-green">
    <p>Green border.</p>
</div>


<div class="w3-panel w3-border w3-border-red
w3-hover-border-blue">

    <p>Move your mouse over this panel.</p>

</div>

</body>
</html>
