<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css table</title>
    <style>
        table{
            border: 3px solid black;
            background-color: rgb(255, 255, 255);
            width: 80%;
            height: 50vh;
            margin: 20px;
            border-collapse: separate;
            border-spacing: 10px;

        }
        caption{
            caption-side: top;
            font-size: 40px;
            font-weight: 600;
            color: rgb(255, 0, 0);
            padding: 10px;
        }
        th,td{
            border: 3px solid green;
            text-align: center;
            /* background-color: rgb(255, 255, 255); */
        }
        th{
            font-size: large;
            font-weight: 700;
            color: brown;
        }
        tr:hover{
            background-color: rgb(255, 0, 0);
        }


    </style>
</head>
<body>
    <table>
        <caption>Student Record</caption>
        <tr>
            <th>Roll no </th>
            <th>Name</th>
            <th>Class</th>
            <th>Subject</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Amit</td>
            <td>o leveel</td>
            <td>WDP</td>
        </tr>
        <tr>
            <td>2</td>
            <td>ayush</td>
            <td>o leveel</td>
            <td>WDP</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Ram</td>
            <td>o leveel</td>
            <td>WDP</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Shyam</td>
            <td>o leveel</td>
            <td>WDP</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Ravan</td>
            <td>o leveel</td>
            <td>WDP</td>
        </tr>
    </table>
    
</body>
</html>
